<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a href="dashboard.html" class="nav-link">Dashboard</a></li>
                <li class="nav-item"><a href="reader.html" class="nav-link">Topics</a></li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="upload.html" class="nav-link">Teacher Portal</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container mt-3">
        <div id="articles-container">
            <p>Loading article...</p>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { initReader, handleLogout } from './js/reader.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Verificamos que el usuario esté logueado
            requireAuth();

            // Ejecutamos el lector. 
            // Como la URL tiene un "?id=XX", initReader() sabrá 
            // automáticamente que debe cargar el artículo y su QUIZ.
            initReader();

            // Activamos el botón de salir
            handleLogout(logout);
        });
    </script>

</body>
</html>
