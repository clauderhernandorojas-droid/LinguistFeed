<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Article - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar"></nav>

    <div class="container mt-3">
        <div id="articles-container">
            <p>Loading article...</p>
        </div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { initReader, handleLogout } from './js/reader.js';
        import { mountNavbar } from './js/navbar.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Verificamos que el usuario esté logueado
            requireAuth();
            mountNavbar('student', '');

            // Ejecutamos el lector. 
            // Como la URL tiene un "?id=XX", initReader() sabrá 
            // automáticamente que debe cargar el artículo y su QUIZ.
            initReader();

            // Activamos el botón de salir
            handleLogout(logout);
        });
    </script>

</body>
</html>
