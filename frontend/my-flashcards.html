<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flashcards - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar"></nav>

    <div class="container flashcards-main-container">
        <h1 class="flashcards-title">My Flashcards</h1>

        <section id="decks-view">
            <!-- Buscador centrado con diseño estilizado -->
            <div class="decks-search-wrapper">
                <div class="decks-search-box">
                    <span class="decks-search-icon" aria-hidden="true">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </span>
                    <input id="deck-search-input" type="search" placeholder="Search deck..." autocomplete="off" />
                </div>
            </div>

            <!-- Fila de controles superiores limpia y no amontonada -->
            <div class="decks-toolbar">
                <div class="decks-toolbar-left">
                    <button type="button" id="new-deck-btn" class="btn btn-accent-new-deck">+ New deck</button>
                </div>
                <div class="decks-toolbar-right">
                    <button id="btn-sync-lexispelling" class="btn btn-lexispelling-cloud" type="button">☁️ Sincronizar a la nube (Lexispelling)</button>
                    <button id="btn-export-lexispelling-csv" class="btn btn-lexispelling-main" type="button">📥 Exportar para Lexispelling (.csv)</button>
                    <button type="button" id="export-all-json-btn" class="btn btn-subtle-json">Export all JSON</button>
                </div>
            </div>

            <div id="deck-empty-state" class="text-center" hidden>
                <p>No decks yet. Create one to start reviewing.</p>
            </div>

            <div id="decks-grid" class="decks-grid"></div>

            <!-- Barra flotante inferior de selección múltiple (oculta por defecto si selectedCount === 0) -->
            <div id="multi-select-bar" class="multi-select-bar" hidden>
                <div class="multi-select-pill">
                    <span id="multi-select-count" class="multi-select-badge">0 selected</span>
                    <button type="button" id="review-selected-btn" class="btn btn-pill-review">▶ Review selected</button>
                    <button type="button" id="btn-sync-selected-lexispelling" class="btn btn-pill-cloud">☁️ Sincronizar a la nube</button>
                    <button type="button" id="btn-export-selected-lexispelling" class="btn btn-pill-export">📥 Exportar para Lexispelling (.csv)</button>
                    <button type="button" id="cancel-select-mode-btn" class="btn-deselect-all">Deselect all</button>
                </div>
            </div>
        </section>

        <section id="study-view" hidden>
            <div class="flashcard-page-actions">
                <button type="button" id="back-to-decks-btn" class="btn">Back to decks</button>
                <button type="button" id="rename-deck-btn" class="btn">Rename deck</button>
                <button type="button" id="study-sync-lexispelling-btn" class="btn btn-lexispelling-cloud">☁️ Sincronizar mazo a la nube</button>
                <button type="button" id="study-export-lexispelling-btn" class="btn btn-lexispelling-main">📥 Exportar para Lexispelling (.csv)</button>
                <button type="button" id="export-json-btn" class="btn">Export JSON</button>
                <button type="button" id="delete-all-in-deck-btn" class="btn btn-danger">Delete all cards in this deck</button>
            </div>

            <h2 id="study-deck-title" class="text-center"></h2>
            <p id="study-deck-context" class="text-center"></p>
            <p id="study-card-counter" class="text-center"></p>
            <p id="single-deck-actions-note" class="text-center" hidden>Single-deck actions are disabled while reviewing multiple decks.</p>

            <div id="no-flashcards" class="text-center" style="display:none;">
                <p>This deck has no flashcards yet.</p>
            </div>

            <div id="flashcard-container" class="flashcard-container">
                <div id="flashcard-inner" class="flashcard-inner">
                    <div class="flashcard-front">
                        <h2 id="flashcard-word"></h2>
                        <button type="button" id="flashcard-speak-btn" class="btn-audio" title="Listen to word" aria-label="Listen to word">Listen</button>
                        <p class="flashcard-hint">(Click to flip)</p>
                    </div>
                
                    <div class="flashcard-back">
                        <p id="flashcard-definition"></p>
                        <p id="flashcard-translation"></p>
                        <p id="flashcard-example"></p>
                    </div>
                </div>
            </div>

            <div class="flashcard-controls">
                <button id="prev-button" class="btn">Previous</button>
                <button id="flip-button" class="btn">Flip Card</button>
                <button id="next-button" class="btn">Next</button>
                <button id="delete-button" class="btn btn-danger">Delete</button>
            </div>
        </section>
    </div>

    <div id="confirm-modal" class="simple-modal" hidden>
        <div class="simple-modal-content">
            <h3 id="confirm-modal-title">Confirm action</h3>
            <p id="confirm-modal-message">Are you sure?</p>
            <div class="simple-modal-actions">
                <button type="button" id="confirm-modal-cancel" class="btn">Cancel</button>
                <button type="button" id="confirm-modal-confirm" class="btn btn-danger">Confirm</button>
            </div>
        </div>
    </div>

    <div id="flashcards-toast" class="flashcards-toast" hidden></div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { handleLogout } from './js/reader.js';
        // Importamos la lógica interna de tus flashcards
        import { initFlashcards } from './js/my-flashcards.js';
        import { mountNavbarForCurrentUser } from './js/navbar.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Verificamos sesión
            requireAuth();
            mountNavbarForCurrentUser('');
            
            // Inicializamos el mazo de cartas
            initFlashcards();

            // Activamos el botón de salir unificado
            handleLogout(logout);
        });
    </script>
</body>
</html>
