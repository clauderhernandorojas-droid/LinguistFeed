<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Flashcards - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="reader.html" 
                       class="nav-link" 
                       onclick="localStorage.removeItem('selectedTopic'); localStorage.removeItem('selectedArticleId');">
                       Topics
                    </a>
                </li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>My Flashcards</h1>

        <div id="no-flashcards" class="text-center" style="display:none;">
            <p>No flashcards saved yet. Go to <a href="reader.html">Topics</a> to start learning!</p>
        </div>

        <div id="flashcard-container" class="flashcard-box" style="margin-top: 20px;">
            <div id="card-front" class="card-side" style="padding: 40px; border: 2px solid #007bff; border-radius: 15px; text-align: center; background: white; cursor: pointer;">
                <h2 id="flashcard-word" style="font-size: 2.5rem; color: #007bff;"></h2>
                <p style="color: #666; font-size: 0.9rem;">(Click to flip)</p>
            </div>

            <div id="card-back" class="card-side" style="display:none; padding: 40px; border: 2px solid #28a745; border-radius: 15px; background: #f8fff9; cursor: pointer;">
                <p id="flashcard-definition" style="font-size: 1.2rem; font-weight: bold;"></p>
                <p id="flashcard-example" class="flashcard-example" style="font-style: italic; color: #555; margin-top: 10px;"></p>
                <p id="flashcard-translation" class="flashcard-translation" style="color: #28a745; margin-top: 10px; font-weight: bold;"></p>
            </div>
        </div>

        <div class="flashcard-controls" style="margin-top: 30px; display: flex; justify-content: center; gap: 10px;">
            <button id="prev-button" class="btn">Previous</button>
            <button id="flip-button" class="btn">Flip Card</button>
            <button id="next-button" class="btn">Next</button>
            <button id="delete-button" class="btn" style="background:#dc3545; color: white; border: none;">Delete</button>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { handleLogout } from './js/reader.js';
        // Importamos la lógica interna de tus flashcards
        import { initFlashcards } from './js/flashcards.js';

        document.addEventListener('DOMContentLoaded', () => {
            // Verificamos sesión
            requireAuth();
            
            // Inicializamos el mazo de cartas
            initFlashcards();

            // Activamos el botón de salir unificado
            handleLogout(logout);
        });
    </script>
</body>
</html>
