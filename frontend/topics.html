<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Topics - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .row-topics {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .topic-card {
            padding: 25px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            cursor: pointer;
            transition: all 0.3s ease;
            border: 1px solid #eee;
        }
        .topic-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: #0066cc;
        }
        .topic-card h2 {
            color: #0066cc;
            margin-top: 0;
            font-size: 1.5rem;
        }
        .topic-card p {
            color: #555;
            margin-bottom: 0;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a href="reader.html" class="nav-link active">Topics</a></li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Explore Topics</h1>
        <p>Select a category to start reading:</p>
    
        <div id="topics-grid" class="topics-grid">
            <p>Cargando temas...</p>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { handleLogout } from './js/reader.js';
        import { renderTopics } from './js/topics.js'; // Importamos la función
    
        document.addEventListener('DOMContentLoaded', function() {
            requireAuth();
            handleLogout(logout);
            renderTopics(); // Dibujamos los 10 temas
        });
    </script>
    <script type="module" src="js/topics.js"></script>
</body>
</html>
