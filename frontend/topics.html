<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguistFeed - Topics</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f5f9;
            margin: 40px 0 20px 0;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        hr { border: 0; height: 1px; background: rgba(255, 255, 255, 0.08); margin: 45px 0; }
        #searchBarTopics {
            width: 100%;
            max-width: 480px;
            margin: 16px 0 24px 0;
            padding: 12px 16px;
            font-size: 0.95rem;
            color: #f8fafc;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            box-sizing: border-box;
            backdrop-filter: blur(8px);
        }
        #searchBarTopics:focus {
            outline: none;
            border-color: #38bdf8;
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }
    </style>
</head>
<body>
    <nav class="navbar"></nav>

    <div class="container">
        <h1 style="margin-top: 30px; font-weight: 800; letter-spacing: -0.5px;">Explore Topics</h1>
        <p style="color: #94a3b8; font-size: 1.05rem;">Curated English reading library leveled for your proficiency.</p>

        <input type="search" id="searchBarTopics" placeholder="Buscar temas..." autocomplete="off">

        <h2 class="section-title">Favorite Topics</h2>
        <div id="favorites-grid" class="topics-grid"></div>

        <hr>

        <h2 class="section-title">Explore All Categories</h2>
        <div id="others-grid" class="topics-grid"></div>
    </div>

    <script src="./js/ui-handlers.js"></script>
    <script type="module" src="./js/topics-page.js"></script>
    <script src="./js/search.js"></script>
</body>
</html>
