<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguistFeed - Topics</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos rápidos para asegurar la división */
        .section-title {
            font-size: 1.8rem;
            color: #2d3748;
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
        }
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .topic-card {
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .topic-card:hover { transform: translateY(-5px); }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 50px 0; }
    </style>
</head>
<body>
    <nav class="navbar"></nav>

    <div class="container">
        <h1 style="margin-top: 30px;">Explore Topics</h1>
        <p>Your personalized reading library.</p>

        <h2 class="section-title">Your Favorite Topics 🌟</h2>
        <div id="favorites-grid" class="topics-grid"></div>

        <hr>

        <h2 class="section-title">Want to explore something else? 🔍</h2>
        <div id="others-grid" class="topics-grid"></div>
    </div>

    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { handleLogout } from './js/reader.js';
        import { mountNavbar } from './js/navbar.js';

        // Lógica integrada para evitar problemas de caché
        const allTopics = [
            { id: 'classroom', name: 'Classroom', icon: '👨‍🏫', color: '#fff9c4', special: true },
            { id: 'news', name: 'Global News', icon: '🌎', color: '#e3f2fd' },
            { id: 'business', name: 'Business', icon: '💼', color: '#f3e5f5' },
            { id: 'tech', name: 'Technology', icon: '💻', color: '#e8f5e9' },
            { id: 'science', name: 'Science', icon: '🔬', color: '#e0f2f1' },
            { id: 'history', name: 'History', icon: '📜', color: '#fff8e1' },
            { id: 'culture', name: 'Culture', icon: '🎨', color: '#fce4ec' },
            { id: 'gaming', name: 'Gaming', icon: '🎮', color: '#ede7f6' },
            { id: 'trends', name: 'Pop Culture', icon: '✨', color: '#fff3e0' },
            { id: 'health', name: 'Health', icon: '🏥', color: '#f1f8e9' },
            { id: 'lifestyle', name: 'Lifestyle', icon: '🏠', color: '#efebe9' },
            { id: 'edu', name: 'Education', icon: '📚', color: '#f0f4c3' },
            { id: 'travel', name: 'Travel', icon: '✈️', color: '#ffe0b2' },
            { id: 'movies', name: 'Movies & Series', icon: '🎬', color: '#d1c4e9' }
        ];

        function render() {
            const favGrid = document.getElementById('favorites-grid');
            const otherGrid = document.getElementById('others-grid');
            
            // Simulamos intereses si no hay (para que veas el efecto ahora mismo)
            let interests = localStorage.getItem('user-interests');
            if (!interests) {
                interests = "tech,science"; // Por defecto para la prueba
            }
            const myInterests = interests.split(',').map(i => i.trim());

            favGrid.innerHTML = '';
            otherGrid.innerHTML = '';

            allTopics.forEach(topic => {
                const card = document.createElement('div');
                card.className = 'topic-card';
                card.style.backgroundColor = topic.color;
                card.innerHTML = `
                    <div style="font-size: 3rem; margin-bottom: 10px;">${topic.icon}</div>
                    <strong>${topic.name}</strong>
                `;
                card.onclick = () => window.location.href = `reader.html#topic=${topic.id}`;

                // REGLA DE ORO: Si es Classroom o está en mis intereses, va arriba
                if (topic.special || myInterests.includes(topic.id)) {
                    favGrid.appendChild(card);
                } else {
                    otherGrid.appendChild(card);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            mountNavbar('student', '');
            render();
            handleLogout(logout);
        });
    </script>
</body>
</html>
