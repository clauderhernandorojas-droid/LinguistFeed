<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinguistFeed - Topics</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        /* Estilos rápidos para asegurar la división */
        .section-title {
            font-size: 1.8rem;
            color: #2d3748;
            margin: 40px 0 20px 0;
            padding-bottom: 10px;
            border-bottom: 2px solid #edf2f7;
        }
        .topics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .topic-card {
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .topic-card:hover { transform: translateY(-5px); }
        hr { border: 0; height: 1px; background: #e2e8f0; margin: 50px 0; }
        #searchBarTopics {
            width: 100%;
            max-width: 480px;
            margin: 16px 0 24px 0;
            padding: 10px 14px;
            font-size: 1rem;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <nav class="navbar"></nav>

    <div class="container">
        <h1 style="margin-top: 30px;">Explore Topics</h1>
        <p>Your personalized reading library.</p>

        <input type="search" id="searchBarTopics" placeholder="Buscar temas..." autocomplete="off">

        <h2 class="section-title">Your Favorite Topics 🌟</h2>
        <div id="favorites-grid" class="topics-grid"></div>

        <hr>

        <h2 class="section-title">Want to explore something else? 🔍</h2>
        <div id="others-grid" class="topics-grid"></div>
    </div>

    <script type="module" src="./js/topics-page.js"></script>
    <script src="./js/search.js"></script>
</body>
</html>
