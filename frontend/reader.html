<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Articles - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css?v=3">
</head>
<body>

    <nav class="navbar"></nav>
    <div class="container mt-4">
        <div class="reader-top-bar" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px;">
            <a href="topics.html" class="btn btn-secondary" style="text-decoration: none; margin: 0; display: inline-block;">
                ← Back to Topics
            </a>

            <div id="active-reading-widget" class="active-reading-widget" title="Tiempo de lectura activa hoy">
                <div class="widget-content">
                    <span class="reading-status-dot" id="reading-status-dot" title="Lectura pausada"></span>
                    <div class="widget-info">
                        <div class="widget-text" style="font-size: 0.88rem; font-weight: 700; display: flex; align-items: center; gap: 4px;">
                            <span id="reading-time-display">⏱️ 0 / 15 min</span>
                        </div>
                        <div class="widget-bar-bg" style="width: 100px; height: 5px; background: rgba(148, 163, 184, 0.25); border-radius: 999px; overflow: hidden; margin-top: 3px;">
                            <div id="reading-progress-bar" style="width: 0%; height: 100%; background: #2563eb; border-radius: 999px; transition: width 0.3s ease, background-color 0.3s ease;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <h1 id="topic-title">Today's Articles</h1>
        <input type="search" id="searchBarCategory" placeholder="Buscar artículos..." autocomplete="off" style="width:100%;padding:8px;margin-bottom:12px;">
        
        <div id="level-selector-container" class="level-selector" style="margin-bottom: 20px; display: none; gap: 10px;"></div>
        <div id="loading" class="loading">Loading articles...</div>
        <div id="error" style="display:none; color: red; font-weight: bold;">
            Error loading articles. Please make sure the server is running.
        </div>

        <div id="articles-container"></div>
        <div id="quiz-container" style="margin-top: 30px;"></div>
    </div>

    <div id="flashcard-popup" class="flashcard-popup">
        <div class="flashcard-header">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <h3 id="flashcard-word" style="margin:0; padding-right: 40px; color:#1a202c; font-size: 1.15rem; line-height: 1.3;"></h3>
                <button id="tts-btn" style="background:#f0f4f8; border:none; cursor:pointer; font-size:1.2rem; border-radius: 50%; width: 35px; height: 35px; flex-shrink: 0;">🔊</button>
            </div>
        </div>
    
        <div class="flashcard-scroll-area">
            <p><strong>Definition:</strong> <span id="flashcard-definition"></span></p>
            <p><strong>Translation:</strong> <span id="flashcard-translation" style="color: #28a745; font-weight: bold;"></span></p>
            <p id="flashcard-example"></p>
        </div>
    
        <div class="flashcard-actions">
            <button id="save-flashcard-btn" class="btn-save" style="background:#28a745; color:white; border:none; flex:2; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer;">Save to Flashcards</button>
            <button onclick="window.closeFlashcardPopup()" class="btn-close" style="background:#edf2f7; color:#4a5568; border:1px solid #cbd5e0; flex:1; padding:8px; border-radius:6px; cursor:pointer;">Close</button>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script src="./js/ui-handlers.js"></script>
    <script src="./js/search.js"></script>
    <script type="module">
        import { requireAuth, logout } from './js/auth.js';
        import { initReader, handleLogout } from './js/reader.js?v=14';
        import { mountNavbarForCurrentUser } from './js/navbar.js';

        document.addEventListener('DOMContentLoaded', async () => {
            requireAuth();
            mountNavbarForCurrentUser('');
            try {
                await initReader();
            } catch (error) {
                console.error('❌ Error cargando el lector:', error);
            }
            handleLogout(logout);
            const saveBtn = document.getElementById('save-flashcard-btn');
            if (saveBtn) {
                saveBtn.onclick = () => window.saveFlashcardToStorage();
            }
        });
    </script>

    <div id="reading-goal-toast" class="reading-goal-toast" style="display: none;">
        <span class="toast-icon">🎯</span>
        <div class="toast-text">
            <strong>¡Meta diaria completada!</strong>
            <span>¡Excelente progreso! Puedes continuar leyendo libremente.</span>
        </div>
        <button type="button" class="toast-close" onclick="this.parentElement.style.display='none'" aria-label="Cerrar">&times;</button>
    </div>
</body>
</html>
