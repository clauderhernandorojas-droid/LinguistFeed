<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Articles - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="reader.html" 
                       class="nav-link" 
                       onclick="localStorage.removeItem('selectedTopic'); localStorage.removeItem('selectedArticleId');">
                       Topics
                    </a>
                </li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Today's Articles</h1>
        
        <div id="loading" class="loading">Loading articles...</div>
        
        <div id="error" style="display:none; color: red; font-weight: bold;">
            Error loading articles. Please make sure the server is running.
        </div>
        
        <div id="articles-container"></div>
        <div id="quiz-container" style="margin-top: 30px;"></div>
    </div>

    <div id="flashcard-popup" class="flashcard-popup" style="display:none;">
        <div class="flashcard-content">
            <h3 id="flashcard-word"></h3>
            <p id="flashcard-definition"></p>
            <p id="flashcard-example" class="flashcard-example"></p>
            <p id="flashcard-translation" class="flashcard-translation"></p>

            <div class="mt-3">
                <button id="save-flashcard-btn" class="btn btn-save" style="margin-right:10px;">
                    Save Flashcard
                </button>
                <button id="close-flashcard-btn" class="btn btn-secondary">Close</button>
            </div>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from '/js/auth.js';
        import { initReader, handleLogout } from '/js/reader.js?v=5'; // Subimos a v=5 para refrescar
    
        document.addEventListener('DOMContentLoaded', async function() {
            console.log("🚀 DOM cargado. URL actual:", window.location.href); // NUEVO LOG
            requireAuth();
    
            try {
                // Pasamos la URL directamente como un "seguro"
                await initReader(); 
            } catch (error) {
                console.error("❌ Error en el flujo principal:", error);
            }
    
            handleLogout(logout);
    
            const saveBtn = document.getElementById('save-flashcard-btn');
            if (saveBtn) saveBtn.onclick = saveFlashcardToStorage;
        });
    </script>
</body>
</html>
