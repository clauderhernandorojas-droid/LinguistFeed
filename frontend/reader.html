<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Articles - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="reader.html" 
                       class="nav-link" 
                       onclick="localStorage.removeItem('selectedTopic'); localStorage.removeItem('selectedArticleId');">
                       Topics
                    </a>
                </li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Today's Articles</h1>
        
        <div id="level-selector-container" class="level-selector" style="margin-bottom: 20px; display: flex; gap: 10px;"></div>
    
        <div id="loading" class="loading">Loading articles...</div>
        
        <div id="error" style="display:none; color: red; font-weight: bold;">
            Error loading articles. Please make sure the server is running.
        </div>
        
        <div id="articles-container"></div>
        <div id="quiz-container" style="margin-top: 30px;"></div>
    </div>

    <div id="flashcard-popup" class="flashcard-popup">
        <div class="flashcard-header">
            <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                <h3 id="flashcard-word" style="margin:0; padding-right: 40px; color:#1a202c; font-size: 1.15rem; line-height: 1.3;"></h3>
                <button id="tts-btn" style="background:#f0f4f8; border:none; cursor:pointer; font-size:1.2rem; border-radius: 50%; width: 35px; height: 35px; flex-shrink: 0;">🔊</button>
            </div>
        </div>
    
        <div class="flashcard-scroll-area">
            <p><strong>Definition:</strong> <span id="flashcard-definition"></span></p>
            <p><strong>Translation:</strong> <span id="flashcard-translation" style="color: #28a745; font-weight: bold;"></span></p>
            <p id="flashcard-example"></p>
        </div>
    
        <div class="flashcard-actions">
            <button id="save-flashcard-btn" class="btn-save" style="background:#28a745; color:white; border:none; flex:2; padding:8px; border-radius:6px; font-weight:bold; cursor:pointer;">Save to Flashcards</button>
            <button onclick="window.closeFlashcardPopup()" class="btn-close" style="background:#edf2f7; color:#4a5568; border:1px solid #cbd5e0; flex:1; padding:8px; border-radius:6px; cursor:pointer;">Close</button>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from '/js/auth.js';
        // Importante: initReader y handleLogout vienen del módulo
        import { initReader, handleLogout } from '/js/reader.js?v=6'; 
    
        document.addEventListener('DOMContentLoaded', async function() {
            console.log("🚀 Lector iniciado en:", window.location.href);
            requireAuth();
    
            try {
                await initReader(); 
            } catch (error) {
                console.error("❌ Error cargando el lector:", error);
            }
    
            handleLogout(logout);
    
            // Los botones se vinculan a las funciones globales que pusimos en window
            const saveBtn = document.getElementById('save-flashcard-btn');
            if (saveBtn) {
                saveBtn.onclick = () => window.saveFlashcardToStorage();
            }
        });
    </script>
</body>
</html>
