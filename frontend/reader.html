<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Articles - LinguistFeed</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="dashboard.html" class="navbar-brand">LinguistFeed</a>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a href="reader.html" 
                       class="nav-link" 
                       onclick="localStorage.removeItem('selectedTopic'); localStorage.removeItem('selectedArticleId');">
                       Topics
                    </a>
                </li>
                <li class="nav-item"><a href="my-flashcards.html" class="nav-link">My Flashcards</a></li>
                <li class="nav-item"><a href="#" id="logout-link" class="nav-link">Logout</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <h1>Today's Articles</h1>
        
        <div id="loading" class="loading">Loading articles...</div>
        
        <div id="error" style="display:none; color: red; font-weight: bold;">
            Error loading articles. Please make sure the server is running.
        </div>
        
        <div id="articles-container"></div>
        <div id="quiz-container" style="margin-top: 30px;"></div>
    </div>

    <div id="flashcard-popup" class="flashcard-popup" style="display:none; position:fixed; background:white; border:2px solid #007bff; padding:15px; border-radius:12px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); width: 300px; z-index: 10001;">
        <div class="flashcard-content">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                <h3 id="flashcard-word" style="margin:0; color:#1a202c; font-size: 1.2rem;"></h3>
                <button id="tts-btn" style="background:#f0f4f8; border:none; cursor:pointer; font-size:1.4rem; border-radius: 50%; width: 40px; height: 40px;" title="Listen">🔊</button>
            </div>
            
            <div style="border-top: 1px solid #edf2f7; padding-top: 10px;">
                <p style="margin-bottom: 5px;"><strong>Definition:</strong> <span id="flashcard-definition" style="color: #4a5568;"></span></p>
                <p style="margin-bottom: 5px;"><strong>Translation:</strong> <span id="flashcard-translation" style="color: #28a745; font-weight: bold;"></span></p>
                <p id="flashcard-example" style="font-style:italic; color:#718096; font-size:0.85rem; margin-top: 8px; border-left: 3px solid #cbd5e0; padding-left: 8px;"></p>
            </div>
    
            <div style="display:flex; gap:10px; margin-top:15px;">
                <button id="save-flashcard-btn" class="btn" style="flex:2; background:#28a745; color:white; border:none; padding:8px; border-radius:6px; cursor:pointer; font-weight:bold;">
                    Save to Flashcards
                </button>
                <button onclick="window.closeFlashcardPopup()" style="flex:1; background:#edf2f7; color:#4a5568; border:1px solid #cbd5e0; padding:8px; border-radius:6px; cursor:pointer;">
                    Close
                </button>
            </div>
        </div>
    </div>

    <footer class="container text-center mt-3">
        <p>&copy; 2026 LinguistFeed. All rights reserved.</p>
    </footer>

    <script type="module">
        import { requireAuth, logout } from '/js/auth.js';
        // Importante: initReader y handleLogout vienen del módulo
        import { initReader, handleLogout } from '/js/reader.js?v=6'; 
    
        document.addEventListener('DOMContentLoaded', async function() {
            console.log("🚀 Lector iniciado en:", window.location.href);
            requireAuth();
    
            try {
                await initReader(); 
            } catch (error) {
                console.error("❌ Error cargando el lector:", error);
            }
    
            handleLogout(logout);
    
            // Los botones se vinculan a las funciones globales que pusimos en window
            const saveBtn = document.getElementById('save-flashcard-btn');
            if (saveBtn) {
                saveBtn.onclick = () => window.saveFlashcardToStorage();
            }
        });
    </script>
</body>
</html>
