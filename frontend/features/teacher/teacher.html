<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Profesor</title>
    <link rel="stylesheet" href="../../css/styles.css">
    <link rel="stylesheet" href="css/teacher.css">
</head>
<body class="teacher-page">
    <!-- Navbar -->
    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="#">Profesor</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#student-search">Buscar Estudiantes</a></li>
                <li class="nav-item"><a class="nav-link" id="logout-link" href="#">Logout</a></li>
            </ul>
        </div>
    </nav>

    <!-- Contenido principal -->
    <main class="container">
        <!-- Barra de búsqueda -->
        <section id="student-search" class="card">
            <h2>Buscar Estudiante</h2>
            <input type="text" id="searchInput" placeholder="Nombre del estudiante">
            <button id="searchButton" class="btn-search">Buscar</button>
            <div id="results"></div>
        </section>

        <!-- Dashboard del estudiante -->
        <section class="card">
            <h2>Dashboard del Estudiante</h2>
            <div id="student-stats"></div>
            <div id="vocabulary-section"></div>
        </section>

        <!-- Asignar artículo -->
        <section id="article-upload" class="card">
            <h2>Asignar Artículo</h2>
            <p id="selected-student-msg" style="margin-bottom: 10px; color: #2d3748;">Sin estudiante seleccionado (publicación general).</p>
            <input type="text" id="title" placeholder="Título del artículo">
            <input type="text" id="topic" placeholder="Tema">
            <textarea id="content" placeholder="Texto del artículo"></textarea>
            <button id="submitTaskButton" class="btn-submit">Asignar</button>
            <p id="status-msg"></p>
        </section>
    </main>

    <script type="module" src="../../js/teacher.js"></script>
</body>
</html>
